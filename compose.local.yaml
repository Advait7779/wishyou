# Development database only. Production uses compose.yaml and keeps PostgreSQL private.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wishyou
      POSTGRES_USER: wishyou
      POSTGRES_PASSWORD: wishyou
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wishyou_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishyou -d wishyou"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wishyou_pgdata:
